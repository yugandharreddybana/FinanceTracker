name: Security — Secret scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full-branch reminder scan
    - cron: '0 6 * * 1'

concurrency:
  group: security-secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Personal repos: FREE. Some private org repos need GITLEAKS_LICENSE — see SECURITY.md.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  trufflehog:
    name: TruffleHog OSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diff scan (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --results=verified,unknown --fail

      - name: Full branch scan (push / schedule / manual)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ''
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown --fail
